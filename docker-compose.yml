services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estate-intelligence-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - VECTOR_DB_DIR=/app/data/vector_db
      - SCRAPED_DATA_DIR=/app/data/scraped
      - PROCESSED_DATA_DIR=/app/data/processed
      - CORS_ORIGINS=*
    volumes:
      - vector_db_data:/app/data/vector_db
      - ./data/scraped:/app/data/scraped
      - ./data/processed:/app/data/processed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: estate-intelligence-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vector_db_data:
    driver: local
